target-version = "py310"
line-length = 120
# net1d.py is vendored ECGFounder source; notebooks and docs are not linted here.
extend-exclude = ["ecg_pipeline/interpret/net1d.py", "*.ipynb", "*.md"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE"]
ignore = [
  "E501",    # long lines are left to the formatter
  "UP042",   # str+Enum -> StrEnum changes str() output
  # Held back until #19 is sorted out; removed in the follow-up PR.
  "E741", "F401", "S101", "S603", "BLE001", "SIM105", "SIM115", "B905",
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SIM117"]

[format]
quote-style = "double"
