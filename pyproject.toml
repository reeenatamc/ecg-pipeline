[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-pipeline"
version = "0.1.0"
description = "ECG image -> digitized time series -> diagnostic interpretation"
requires-python = ">=3.10"
# Bounds mirror requirements.txt; see the comments there for why each one exists.
dependencies = [
    "numpy>=1.26,<2",
    "torch>=2.2,<2.4",
    "scipy>=1.12,<2",
    "pillow>=10.2",
    "matplotlib>=3.8",
]

[project.scripts]
ecg-pipeline = "ecg_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["ecg_pipeline*"]

[tool.setuptools.package-data]
"ecg_pipeline.interpret" = ["tasks.txt"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["net1d", "matplotlib.*"]
ignore_missing_imports = true
