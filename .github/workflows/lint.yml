name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"
          args: check --output-format github
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"
          args: format --check
